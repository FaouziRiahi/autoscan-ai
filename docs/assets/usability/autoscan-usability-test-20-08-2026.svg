      <circle cx="40" cy="212" r="8" fill="#249765"/><text x="65" y="220" font-size="20" fill="#0B1F3A">Handlung steht sinnvoll vor Technikdetails</text>
    </g>

    <g transform="translate(820 330)">
      <rect width="710" height="250" rx="26" fill="#FFFFFF" stroke="#D6E0EB" stroke-width="2"/>
      <text x="30" y="48" font-size="26" font-weight="700" fill="#A82A44">Wichtigste Usability-Probleme</text>
      <text x="30" y="92" font-size="19" font-weight="700" fill="#A82A44">KRITISCH</text><text x="145" y="92" font-size="20" fill="#0B1F3A">Mittlere Dringlichkeit führt nicht eindeutig zur Handlung</text>
      <text x="30" y="132" font-size="19" font-weight="700" fill="#B36B00">HOCH</text><text x="145" y="132" font-size="20" fill="#0B1F3A">OBD-II-Anschluss ist für Anfänger unklar</text>
      <text x="30" y="172" font-size="19" font-weight="700" fill="#B36B00">HOCH</text><text x="145" y="172" font-size="20" fill="#0B1F3A">Informationsherkunft ist nicht deutlich genug</text>
      <text x="30" y="212" font-size="19" font-weight="700" fill="#617187">MITTEL</text><text x="145" y="212" font-size="20" fill="#0B1F3A">Restzeit und Berichtsvorschau fehlen</text>
