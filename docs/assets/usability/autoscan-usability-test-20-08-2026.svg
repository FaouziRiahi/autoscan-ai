    <rect x="70" y="865" width="1460" height="85" rx="22" fill="#0B1F3A"/>
    <text x="105" y="905" font-size="21" font-weight="700" fill="#FFFFFF">KERNERGEBNIS</text>
    <text x="105" y="932" font-size="19" fill="#D8E6F8">Der Ablauf funktioniert grundsätzlich. Die sichere Übersetzung von Risikostufe zu Handlung braucht die stärkste Verbesserung.</text>
    <rect x="1325" y="885" width="165" height="45" rx="22" fill="#176FF2"/>
    <text x="1408" y="914" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">SIMULATION</text>
